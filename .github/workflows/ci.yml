name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with: {python-version: "3.12"}
      - name: Ruff
        if: hashFiles('pyproject.toml') != ''
        run: pip install ruff && ruff check src tests

  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with: {python-version: "${{ matrix.python }}"}
      - name: Install and test
        if: hashFiles('pyproject.toml') != ''
        run: |
          pip install -e ".[dev]"
          pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intentlist
          POSTGRES_PASSWORD: intentlist
          POSTGRES_DB: intentlist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intentlist" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTENTLIST_TEST_DATABASE_URL: postgresql+psycopg://intentlist:intentlist@localhost:5432/intentlist_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml') != ''
        with: {python-version: "3.12"}
      - name: Install and test against Postgres
        if: hashFiles('pyproject.toml') != ''
        run: |
          pip install -e ".[dev]"
          pytest -q
