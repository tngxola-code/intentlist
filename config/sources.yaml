# Source registry = the compliance boundary.
#
# A URL is fetched ONLY when its domain (or a parent domain) is listed here with `allowed: true`.
# Every source starts `allowed: false` until someone has read its Terms of Service and robots.txt
# and recorded the outcome in `tos_notes` / `tos_reviewed_on`. Domains that search surfaces but
# that aren't registered are logged as `blocked` captures; `intentlist sources pending`
# lists them ranked by how often they appear, so review effort goes where the leads are.
#
# The entries below are CANDIDATES only. None has been ToS-reviewed.

sources:
