# Category taxonomy. Only `active: true` categories are scheduled.
# The 16 categories after watches and cars are PROVISIONAL: confirm the list with the client.
#
# Specificity rule (qualification gate): a request counts as "specific" when its description
# mentions at least one maker AND at least one of: a model keyword, a reference pattern match,
# or a model year. "Looking for a nice watch" fails; "WTB Rolex 116500LN Daytona" passes.

intent_phrases:
  en: ["WTB", "want to buy", "wanted to buy", "ISO", "in search of", "looking for", "looking to buy",
       "seeking", "wanted:", "searching for", "hunting for", "anyone selling", "on the hunt for"]
  fr: ["recherche", "je cherche", "à la recherche de", "achète"]
  de: ["suche", "gesucht", "kaufe"]
  es: ["busco", "compro", "se busca"]
  it: ["cerco", "compro"]
  nl: ["gezocht", "zoek"]

categories:
  - slug: watches
    name: Rare and valuable watches
    active: true
    makers: [Rolex, Patek Philippe, Audemars Piguet, Vacheron Constantin, A. Lange & Söhne, Richard Mille,
             Omega, Jaeger-LeCoultre, Breguet, F.P. Journe, Cartier, Tudor, Heuer, Universal Geneve,
             Grand Seiko, IWC, Panerai, Blancpain, Zenith, MB&F, De Bethune, Philippe Dufour]
    models: [Daytona, Submariner, GMT-Master, Explorer, Sea-Dweller, Day-Date, Datejust, Milgauss,
             Nautilus, Aquanaut, Calatrava, Royal Oak, Offshore, Overseas, Speedmaster, Seamaster,
             Reverso, Lange 1, Datograph, Tank, Crash, Santos, Monaco, Carrera, Autavia, Polerouter,
             Snowflake, Chronomètre Bleu, Luminor, Radiomir, Fifty Fathoms, Tourbillon, Paul Newman]
    reference_patterns: ['\b\d{4,6}[A-Z]{0,4}\b', '\bref\.?\s*[A-Z0-9./-]{3,}\b']
    year_pattern: '\b(19[2-9]\d|20[0-2]\d)\b'
    min_value_hint_usd: 5000

  - slug: cars
    name: Classic and collectible cars
    active: true
    makers: [Ferrari, Porsche, Lamborghini, Aston Martin, Mercedes-Benz, Jaguar, Bugatti, McLaren, Shelby,
             Ford, Chevrolet, Alfa Romeo, Lancia, BMW, Maserati, Land Rover, Toyota, Nissan, Datsun,
             Lotus, De Tomaso, Bentley, Rolls-Royce, AC, Austin-Healey, Plymouth, Dodge, Pontiac]
    models: [250 GT, 275, Daytona, Dino, F40, F50, Testarossa, 911, 930, 964, 993, Carrera RS, 356, 959,
             Miura, Countach, Diablo, DB4, DB5, 300SL, Gullwing, E-Type, XK120, Cobra, GT350, GT500,
             GT40, Corvette, Camaro, Mustang, Stratos, Delta Integrale, M1, E30 M3, Defender, Land Cruiser,
             Supra, 2000GT, Skyline, GT-R, 240Z, Ghibli, Mangusta, Pantera, Hemi Cuda, Superbird, GTO]
    reference_patterns: ['\b(1[0-9]{2}|[2-9][0-9]{2})\s?(GT|GTB|GTS|SL|RS)\b', '\bchassis\s*#?\s*\w+']
    year_pattern: '\b(19[0-9]{2}|20[0-2][0-9])\b'
    min_value_hint_usd: 25000

