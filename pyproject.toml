[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlist"
version = "1.0.0"
description = "Evidence-first agentic pipeline that finds, verifies and delivers public wanted-to-buy requests for high-value collectibles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - client owned" }
dependencies = [
  "anthropic>=1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "selectolax>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.7",
  "openpyxl>=3.1",
  "rapidfuzz>=3.6",
  "dnspython>=2.6",
  "email-validator>=2.1",
  "apscheduler>=3.10,<4",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.43"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
intentlist = "intentlist.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentlist = ["review/templates/*.html", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
